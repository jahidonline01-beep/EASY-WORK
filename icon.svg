<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="zapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle for App Icon -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Sleek glowing outer border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="12" opacity="0.85" />

  <!-- Inner ambient background glow -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" opacity="0.25" filter="url(#glow)" />

  <!-- Centered Iconic Lightning / Zap Symbol -->
  <path d="M280 64 L140 280 L250 280 L220 448 L380 220 L270 220 Z" 
        fill="url(#zapGrad)" 
        stroke="#ffffff" 
        stroke-width="8" 
        stroke-linejoin="round"
        stroke-linecap="round"
        filter="url(#glow)" />

  <!-- Live Status Dot -->
  <circle cx="390" cy="120" r="24" fill="#10b981" stroke="#0f172a" stroke-width="8" />
</svg>
